id: refactor-duplication
name: "Refactor duplicated code"
description: |
  Given a Rust file with duplicated validation logic, refactor to remove duplication.
difficulty: medium
category: refactor
skills: ["rust"]
setup:
  - action: mkdir
    path: src
  - action: write
    path: Cargo.toml
    content: |
      [package]
      name = "refactor-dup"
      version = "0.1.0"
      edition = "2021"

      [lib]
      name = "refactor_dup"
      path = "src/lib.rs"
  - action: write
    path: src/lib.rs
    content: |
      pub fn validate_email(email: &str) -> bool {
          if email.is_empty() { return false; }
          if !email.contains("@") { return false; }
          if email.len() > 254 { return false; }
          true
      }

      pub fn validate_username(username: &str) -> bool {
          if username.is_empty() { return false; }
          if username.len() < 3 { return false; }
          if username.len() > 20 { return false; }
          true
      }

      pub fn validate_password(password: &str) -> bool {
          if password.is_empty() { return false; }
          if password.len() < 8 { return false; }
          if password.len() > 128 { return false; }
          true
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          #[test]
          fn test_validate_email() {
              assert!(validate_email("test@example.com"));
              assert!(!validate_email(""));
              assert!(!validate_email("no-at-symbol"));
              assert!(!validate_email(&"a".repeat(255)));
          }

          #[test]
          fn test_validate_username() {
              assert!(validate_username("alice"));
              assert!(!validate_username("ab"));
              assert!(!validate_username(&"a".repeat(21)));
          }

          #[test]
          fn test_validate_password() {
              assert!(validate_password("password123"));
              assert!(!validate_password("short"));
              assert!(!validate_password(&"a".repeat(129)));
          }
      }
instruction: |
  Refactor src/lib.rs to remove the duplicated validation logic.
  Create a helper function `validate_field` that checks for empty,
  min length, and max length. Update all three validation functions
  to use it. All existing tests must still pass.
verify:
  type: cargo_test
  timeout_seconds: 60
tags:
  - rust
  - refactor
  - medium
