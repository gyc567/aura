# Aura 配置文件示例。
# 复制到 ~/.config/aura/config.toml（或 $XDG_CONFIG_HOME/aura/config.toml，
# 或用 AURA_CONFIG 环境变量指定路径）后按需修改。
#
# 优先级：CLI 参数 > 本配置文件 > 环境变量（AURA_API_KEY）。

# OpenAI-compatible endpoint URL（可选，也可用 --endpoint 传入）。
# endpoint = "https://api.openai.com/v1"

# 模型名（可选，也可用 --model 传入）。
# model = "gpt-4o"

# API key（可选，也可用 --api-key 或 AURA_API_KEY 环境变量传入）。
# 建议用环境变量，避免密钥落盘。
# api_key = "sk-..."
