[package]
name = "aura"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "KISS Rust coding agent. Phase 1: pure domain core."
license = "MIT"

[lib]
name = "aura"
path = "src/lib.rs"

[[bin]]
name = "aura"
path = "src/main.rs"

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["macros", "rt", "rt-multi-thread", "signal"] }
tempfile = "3"
ratatui = "0.29"
crossterm = "0.28"
keyring = "3.6"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
